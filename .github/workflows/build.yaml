name: Build

on:
  pull_request:
  push:

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install developement packages
        run:  sudo apt install -y gcc-mingw-w64-i686 make
      - name: Build
        run:  make
      